<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h2>Login API Test</h2>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: 'admin@autonex.com', 
                        password: 'Admin123!@#' 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3>✅ Login Successful!</h3>
                        <p><strong>Token:</strong> ${data.access_token.substring(0, 20)}...</p>
                        <p><strong>Role:</strong> ${data.user_data.role}</p>
                        <p><strong>Email:</strong> ${data.user_data.email}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<h3>❌ Login Failed</h3><p>${data.detail}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
                console.error('Test error:', error);
            }
        }
    </script>
</body>
</html>
